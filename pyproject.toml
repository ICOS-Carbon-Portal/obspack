[build-system]
requires = ["hatchling >= 1.27"]
build-backend = "hatchling.build"

[project]
name = "icoscp_obspack"
version = "0.1.0"
authors = [{name = "Alex Vermeulen", email = "alex.vermeulen@icos-ri.eu"}]
maintainers = [
	{name = "Zois Zogopoulos", email = "zois.zogopoulos@nateko.lu.se"},
]
license = {file = "LICENSE"}
readme = "README.md"
keywords = ["...", "..."]
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"]
requires-python = ">=3.10"
dynamic = ["description"]
dependencies = [
	"icoscp",
	"icoscp_core==0.3.7",
	"matplotlib==3.6.0",
	"pyyaml==6.0.2",
	"requests==2.32.3",
	"scipy==1.15.2",
	"xarray==2025.3.1",
	"netCDF4==1.7.2"
]

[project.urls]
Source = "https://github.com/ICOS-Carbon-Portal/....."

[tool.hatch.envs.lint]
detached = true
dependencies = [
    "hatch",
	"ruff>=0.0.263",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13"]

[tool.hatch.envs.lint.scripts]
lint = [
	"ruff check {args: src/icoscp_obspack}",
]

[tool.ruff]
target-version = "py310"
line-length = 79
exclude = ["ccgfilt.py"]

lint.select = [
  "A",   # flake8-builtins
  "ARG", # flake8-unused-arguments
  "B",   # flake8-bugbear
  "C",   # flake8-comprehensions
  "E",   # pycodestyle (errors)
  "F",   # pyflakes
  "I",   # isort
  "PL",  # pylint-like
  "RUF", # Ruff-specific rules
  "UP",  # pyupgrade
  "W",   # pycodestyle (warnings)
]

lint.ignore = [
  "E501",  # line too long (we already control with line-length)
  "PLR0913", # too many arguments (can be noisy in scientific code)
]
