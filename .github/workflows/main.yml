name: Test & Lint code
run-name: ${{ github.actor }} is linting ${{ github.repository }} 🧹

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

permissions:
  contents: read
  
jobs:
  lint:
    name: testing & linting with Python ${{ matrix.python-version }} 🧹
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Specify the Python versions for testing here.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3
      # Step 2: Automatically set Python version from pyproject.toml
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      # Step 3: Install dependencies using Hatch (since you're using pyproject.toml)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatch
      # Step 4: Run linter
      - name: Run linter
        run: hatch run lint:lint
      # Step 5: Run tests
      - name: Run tests
        run: hatch run test:test
