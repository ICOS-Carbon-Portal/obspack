title_for_doi: 'European Obspack compilation of atmospheric carbon monoxide data from ICOS and non-ICOS European stations for the period 1996-2024'
description_for_doi: 'This data package contains high accuracy CO dry air mole fractions from 32 ICOS and non-ICOS European observatories at in total 73 observation levels, collected by the ICOS Atmosphere Thematic Centre (ATC) and provided by the station contributors. The package is the first release of the CO European Obspack data product (version 11.0), and is intended for use in carbon cycle inverse modeling, model evaluation, and satellite validation studies. Please report errors and send comments regarding this product to the ObsPack originators. Please read carefully the ObsPack Fair Use statement and cite appropriately. Metadata for this product are available at https://commons.datacite.org/doi.org/10.18160/M3VW-DRM5. Please visit http://www.gml.noaa.gov/ccgg/obspack/ for more information.'
